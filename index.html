<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Domain Not Connected</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: #ffffff;
      color: #6b6b6b;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
      align-items: center;
      gap: clamp(20px, 3vw, 44px);
      width: min(100% - 48px, 1140px);
      margin: 0 auto;
      padding: clamp(32px, 6vh, 64px) 0 48px;
      background: #ffffff;
    }

    .copy-panel {
      min-width: 0;
      display: flex;
      justify-content: flex-end;
    }

    .copy {
      width: 100%;
      max-width: 410px;
    }

    h1 {
      margin: 0 0 18px;
      color: #3d3d3d;
      font-size: clamp(23px, 2vw, 31px);
      line-height: 1.22;
      letter-spacing: -0.4px;
      font-weight: 400;
    }

    .intro {
      margin: 0 0 14px;
      font-size: clamp(13px, 1.05vw, 15.5px);
      line-height: 1.45;
      font-weight: 300;
      color: #6e6e6e;
    }

    .steps {
      margin: 0;
      padding-left: 2.25em;
      list-style: none;
      font-size: clamp(13px, 1.05vw, 15.5px);
      line-height: 1.5;
      font-weight: 300;
      color: #6e6e6e;
    }

    .steps li {
      padding-left: 1.15em;
      text-indent: -1.15em;
      margin-bottom: 2px;
    }

    .steps li:last-child {
      margin-bottom: 0;
    }

    .photo-panel {
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: #ffffff;
    }

    .photo-panel img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain;
    }

    @media (max-width: 760px) {
      .page {
        width: calc(100% - 32px);
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 16px;
        padding: 28px 0;
      }

      .copy-panel { justify-content: flex-start; }

      h1 {
        font-size: clamp(18px, 4.5vw, 25px);
        line-height: 1.2;
        margin-bottom: 12px;
      }

      .intro {
        margin-bottom: 10px;
        font-size: clamp(11.5px, 2.8vw, 14px);
      }

      .steps {
        padding-left: 1.5em;
        font-size: clamp(11.5px, 2.8vw, 14px);
      }

      .photo-panel img { max-height: 360px; }
    }

    @media (max-width: 380px) {
      .page { width: calc(100% - 24px); gap: 12px; }
      h1 { font-size: 17px; }
      .intro, .steps { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="copy-panel" aria-label="Domain information">
      <div class="copy">
        <h1>Looks like this domain isn't connected to a website yet</h1>
        <p class="intro">
          Is this your domain?<br>
          Connect it to your website in just a few easy steps:
        </p>
        <ol class="steps">
          <li>1. Go to your domain provider</li>
          <li>2. Click Use a Domain You Already Own</li>
          <li>3. Follow the steps to connect your domain to your website</li>
        </ol>
      </div>
    </section>

    <div class="photo-panel">
      <img src="wires.webp" alt="A tangled pile of blue, silver, and orange cables">
    </div>
  </main>
</body>
</html>
