<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Error</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: #ffffff;
      color: #4a4a4a;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(340px, 1fr) minmax(360px, 1.25fr);
      align-items: center;
      gap: 48px;
      max-width: 1200px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 48px 40px;
      background: #ffffff;
    }

    .copy {
      width: 100%;
      max-width: 460px;
    }

    h1 {
      margin: 0 0 22px;
      color: #333333;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -0.5px;
      font-weight: 400;
    }

    .intro {
      margin: 0 0 16px;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 300;
      color: #555555;
    }

    .steps {
      margin: 0;
      padding-left: 3em;
      list-style: none;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 300;
      color: #555555;
    }

    .steps li {
      margin-bottom: 4px;
    }

    .steps li:last-child {
      margin-bottom: 0;
    }

    .photo-panel {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .photo-panel img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 540px;
      object-fit: contain;
    }

    @media (max-width: 820px) {
      .page {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 36px 24px;
        min-height: auto;
      }

      .copy {
        max-width: 100%;
      }

      h1 {
        font-size: 26px;
      }

      .steps {
        padding-left: 2em;
      }

      .photo-panel img {
        max-height: 400px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="copy" aria-label="Domain information">
      <h1>Looks like this domain isn't connected to a website yet</h1>
      <p class="intro">
        Is this your domain?<br>
        Connect it to your website in just a few easy steps:
      </p>
      <ol class="steps">
        <li>1. Go to your domain provider</li>
        <li>2. Click Use a Domain You Already Own</li>
        <li>3. Follow the steps to connect your domain to your website</li>
      </ol>
    </section>

    <div class="photo-panel">
      <img src="wires.webp" alt="A tangled pile of blue, silver, and orange cables">
    </div>
  </main>
</body>
</html>
