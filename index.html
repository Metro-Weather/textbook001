<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Domain Not Connected</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: #fff;
      color: #353535;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      align-items: center;
      gap: clamp(28px, 4vw, 56px);
      width: min(100% - 48px, 1180px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 48px 0;
      background: #fff;
    }

    .copy-panel {
      position: relative;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
      background: #fff;
    }

    .copy {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      margin: 0 0 clamp(20px, 2.5vw, 28px);
      color: #353535;
      font-size: clamp(25px, 2.1vw, 36px);
      line-height: 1.2;
      letter-spacing: -0.7px;
      font-weight: 400;
    }

    .intro {
      margin: 0 0 18px;
      font-size: clamp(15px, 1.15vw, 19px);
      line-height: 1.4;
      font-weight: 300;
      color: #454545;
    }

    .steps {
      margin: 0;
      padding-left: 4em;
      list-style: none;
      font-size: clamp(14px, 1.05vw, 17px);
      line-height: 1.55;
      font-weight: 300;
      color: #454545;
    }

    .photo-panel {
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .photo-panel img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 540px;
      object-fit: contain;
    }

    /* Keep the side-by-side layout compact on smaller screens too. */
    @media (max-width: 760px) {
      .page {
        width: calc(100% - 32px);
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 16px;
        padding: 28px 0;
      }

      .copy-panel { padding: 12px 0; }
      .copy { max-width: 420px; }

      h1 {
        font-size: clamp(19px, 4.8vw, 28px);
        line-height: 1.18;
        margin-bottom: 14px;
      }

      .intro {
        margin-bottom: 12px;
        font-size: clamp(12px, 3vw, 16px);
        line-height: 1.35;
      }

      .steps {
        padding-left: 2em;
        font-size: clamp(11px, 2.8vw, 15px);
        line-height: 1.45;
      }

      .photo-panel img { max-height: 360px; }
    }

    @media (max-width: 380px) {
      .page { width: calc(100% - 24px); gap: 12px; }
      h1 { font-size: 18px; }
      .intro { font-size: 12px; }
      .steps { padding-left: 1.5em; font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="copy-panel" aria-label="Domain information">
      <div class="copy">
        <h1>Looks like this domain isn't connected to a website yet</h1>
        <p class="intro">
          Is this your domain?<br>
          Connect it to your website in just a few easy steps:
        </p>
        <ol class="steps">
          <li>1. Go to your domain provider</li>
          <li>2. Click Use a Domain You Already Own</li>
          <li>3. Follow the steps to connect your domain to your website</li>
        </ol>
      </div>
    </section>

    <div class="photo-panel">
      <img src="wires.webp" alt="A tangled pile of blue, silver, and orange cables">
    </div>
  </main>
</body>
</html>
