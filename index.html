<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Error</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: #ffffff;
      color: #666666;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr);
      align-items: start;
      gap: 0;
      width: min(100% - 48px, 1280px);
      margin: 0 auto;
      padding: 0 0 48px;
      background: #ffffff;
    }

    .copy-panel {
      position: relative;
      z-index: 2;
      min-width: 0;
      display: flex;
      justify-content: flex-end;
      padding-top: clamp(72px, 11.5vw, 148px);
      padding-right: 12px;
    }

    .copy {
      width: 100%;
      max-width: 390px;
    }

    h1 {
      margin: 0 0 18px;
      color: #383838;
      font-size: clamp(22px, 1.85vw, 27px);
      line-height: 1.24;
      letter-spacing: -0.3px;
      font-weight: 400;
    }

    .intro {
      margin: 0 0 14px;
      font-size: clamp(12.5px, 0.95vw, 13.5px);
      line-height: 1.48;
      font-weight: 400;
      color: #6e6e6e;
    }

    .steps {
      margin: 0;
      padding-left: 0;
      list-style: none;
      font-size: clamp(12.5px, 0.95vw, 13.5px);
      line-height: 1.55;
      font-weight: 400;
      color: #6e6e6e;
    }

    .steps li {
      white-space: nowrap;
      margin-bottom: 1px;
    }

    .steps li:last-child {
      margin-bottom: 0;
    }

    .photo-panel {
      position: relative;
      z-index: 1;
      min-width: 0;
      width: 100%;
      margin-left: -36px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      background: #ffffff;
    }

    .photo-panel img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 580px;
      object-fit: contain;
    }

    @media (max-width: 860px) {
      .steps li {
        white-space: normal;
      }
    }

    @media (max-width: 760px) {
      .page {
        width: calc(100% - 32px);
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 12px;
        padding: 0 0 28px;
      }

      .copy-panel {
        justify-content: flex-start;
        padding-top: 32px;
        padding-right: 0;
      }

      .photo-panel {
        margin-left: 0;
      }

      h1 {
        font-size: clamp(18px, 4.5vw, 24px);
        line-height: 1.2;
        margin-bottom: 12px;
      }

      .intro,
      .steps {
        font-size: clamp(11.5px, 2.8vw, 13.5px);
      }

      .photo-panel img {
        max-height: 360px;
      }
    }

    @media (max-width: 380px) {
      .page { width: calc(100% - 24px); gap: 10px; }
      h1 { font-size: 17px; }
      .intro, .steps { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="copy-panel" aria-label="Domain information">
      <div class="copy">
        <h1>Looks like this domain isn't connected to a website yet</h1>
        <p class="intro">
          Is this your domain?<br>
          Connect it to your website in just a few easy steps:
        </p>
        <ol class="steps">
          <li>1. Go to your domain provider</li>
          <li>2. Click Use a Domain You Already Own</li>
          <li>3. Follow the steps to connect your domain to your website</li>
        </ol>
      </div>
    </section>

    <div class="photo-panel">
      <img src="wires.webp" alt="A tangled pile of blue, silver, and orange cables">
    </div>
  </main>
</body>
</html>
