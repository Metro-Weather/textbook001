<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Domain Not Connected</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: #ffffff;
      color: #666666;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 32px;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 36px 36px;
      background: #ffffff;
    }

    .copy {
      flex: 0 1 420px;
      max-width: 420px;
      padding-top: 56px;
    }

    h1 {
      margin: 0 0 18px;
      color: #333333;
      font-size: 28px;
      line-height: 1.22;
      letter-spacing: -0.3px;
      font-weight: 400;
    }

    .intro {
      margin: 0 0 14px;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 400;
      color: #666666;
    }

    .steps {
      margin: 0;
      padding-left: 0;
      list-style: none;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
      color: #666666;
    }

    .steps li {
      margin-bottom: 2px;
    }

    .steps li:last-child {
      margin-bottom: 0;
    }

    .domain-provider {
      color: #e87722;
    }

    .photo-panel {
      flex: 1 1 55%;
      max-width: 680px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      background: #ffffff;
    }

    .photo-panel img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain;
      object-position: top right;
    }

    @media (max-width: 760px) {
      .page {
        flex-direction: column;
        align-items: stretch;
        padding: 0 20px 28px;
        gap: 20px;
      }

      .copy {
        flex: none;
        max-width: 100%;
        padding-top: 24px;
      }

      h1 {
        font-size: 24px;
      }

      .photo-panel {
        flex: none;
        max-width: 100%;
        justify-content: center;
      }

      .photo-panel img {
        max-height: 360px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="copy" aria-label="Domain information">
      <h1>Looks like this domain isn't connected to a website yet</h1>
      <p class="intro">
        Is this your domain?<br>
        Connect it to your website in just a few easy steps:
      </p>
      <ol class="steps">
        <li>1. Go to your <span class="domain-provider">domain provider</span></li>
        <li>2. Click Use a Domain You Already Own</li>
        <li>3. Follow the steps to connect your domain to your website</li>
      </ol>
    </section>

    <div class="photo-panel">
      <img src="wires.webp" alt="A tangled pile of blue, silver, and orange cables">
    </div>
  </main>
</body>
</html>
