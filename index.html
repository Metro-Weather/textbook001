<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Error</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: #ffffff;
      color: #757575;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 200;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.85fr);
      align-items: start;
      gap: clamp(20px, 2.5vw, 40px);
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 28px 40px;
      background: #ffffff;
    }

    .copy-panel {
      position: relative;
      z-index: 2;
      min-width: 0;
      display: flex;
      justify-content: flex-end;
      padding-top: clamp(110px, 16vh, 195px);
    }

    .copy {
      width: 100%;
      max-width: 440px;
    }

    h1 {
      margin: 0 0 18px;
      color: #4a4a4a;
      font-size: clamp(26px, 2.2vw, 34px);
      line-height: 1.2;
      letter-spacing: -0.4px;
      font-weight: 200;
    }

    .intro {
      margin: 0 0 14px;
      font-size: clamp(13.5px, 1vw, 15.5px);
      line-height: 1.45;
      font-weight: 200;
      color: #757575;
    }

    .steps {
      margin: 0;
      padding-left: 0;
      list-style: none;
      font-size: clamp(13.5px, 1vw, 15.5px);
      line-height: 1.5;
      font-weight: 200;
      color: #757575;
    }

    .steps li {
      margin-bottom: 2px;
    }

    .steps li:last-child {
      margin-bottom: 0;
    }

    .domain-provider {
      color: #e87722;
      font-weight: 300;
    }

    .photo-panel {
      position: relative;
      z-index: 1;
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      background: #ffffff;
    }

    .photo-panel img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: top right;
    }

    @media (max-width: 820px) {
      .page {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 0 20px 32px;
      }

      .copy-panel {
        justify-content: flex-start;
        padding-top: 48px;
      }

      .copy {
        max-width: 100%;
      }

      h1 {
        font-size: 26px;
      }

      .intro,
      .steps {
        font-size: 14px;
      }

      .photo-panel {
        justify-content: center;
      }

      .photo-panel img {
        object-position: center;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="copy-panel" aria-label="Domain information">
      <div class="copy">
        <h1>Looks like this domain isn't connected to a website yet</h1>
        <p class="intro">
          Is this your domain?<br>
          Connect it to your website in just a few easy steps:
        </p>
        <ol class="steps">
          <li>1. Go to your <span class="domain-provider">domain provider</span></li>
          <li>2. Click Use a Domain You Already Own</li>
          <li>3. Follow the steps to connect your domain to your website</li>
        </ol>
      </div>
    </section>

    <div class="photo-panel">
      <img src="wires.webp" alt="A tangled pile of blue, silver, and orange cables">
    </div>
  </main>
</body>
</html>
